<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/style.css">
    <title>Login</title>
</head>
<body>
    <div id="message-container"></div>
    <!-- Login Form -->
     <div class="main-container">
        <div class="card" style="width: 30rem; height: 30rem;">
            <div class="card-body">
                <h5 class="card-title" style="text-align: center;">Login</h5>
            <form id="login-form">
                <div class="mb-3">
                    <label for="user-input" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="user-input" aria-describedby="userHelp">
                </div>
                <div class="mb-3">
                    <label for="pass-input" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="pass-input">
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
                </form>
                <div class="links">
                    <a href="#" class="card-link">¿Contraseña olvidada?</a>
                    <a href="#" class="card-link">No tengo cuenta</a>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="script/index.js"></script>
</html>
